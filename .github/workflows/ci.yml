name: CI

# Verification tiers are defined in ARCHITECTURE.md §6 and DECISIONS.md D-001.
# Tier 1 proves the NextKit core. Tier 2 proves the iOS app layer compiles and its
# Simulator tests pass. Neither requires an Apple Developer Program membership —
# Simulator builds are unsigned. Only Tier 3 (real devices, TestFlight, submission)
# is gated, and that lives in RELEASE_GATED.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrails — NextKit purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce D-002 and D-007
        run: bash scripts/lint-nextkit.sh

      # A product identifier typo compiles, passes every test that uses the Swift constant, and
      # only shows up when a real purchase fails to resolve.
      - name: Enforce the NEXT+ product catalogue
        run: bash scripts/lint-storekit.sh

      # Both invariants held when this was added, and neither was checked by anything. A force
      # unwrap and a URLSession both compile, pass every test, and are only ever caught by
      # someone reading the diff — which is not a guarantee.
      - name: Enforce no force unwraps and no networking in shipped code
        run: bash scripts/lint-shipped-code.sh

      # D-023 promised the icon could not drift from the app's colours and named a script that was
      # never written; D-028 withdrew the promise. This is the mechanism that makes it true —
      # standard library only, so it runs here rather than needing an image package installed.
      - name: Enforce the app icon is made of the palette's values
        run: python3 scripts/lint-app-icon.py

  tier1:
    name: Tier 1 — NextKit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        run: swift --version

      # `--build-tests`, so the test target is held to the same bar as the library. The one
      # warning this repository had was in a test file — a redundant `#require` printed in every
      # green run since it was written, which nobody was ever going to notice by scrolling.
      #
      # Measured clean on Swift 6.3.3 before this was turned on. If a future runner image
      # introduces a diagnostic outside our control this fails, and that is the intended cost:
      # a warning that cannot fail anything is a warning nobody reads.
      - name: Build with warnings as errors
        run: swift build --package-path NextKit --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --package-path NextKit

  tier2:
    name: Tier 2 — iOS app (Simulator)
    runs-on: macos-latest
    needs: tier1
    steps:
      - uses: actions/checkout@v4

      - name: Does the app layer exist yet?
        id: probe
        run: |
          if [ -f project.yml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Deliberately loud rather than a silent green tick. A job that passes because there
      # was nothing to do must never be mistakable for a job that passed because the app
      # compiled. See TESTING.md — no claim may outrun its tier.
      - name: Nothing to verify yet
        if: steps.probe.outputs.exists == 'false'
        run: |
          echo "::notice title=Tier 2 skipped::project.yml does not exist yet, so the iOS app layer has not been created. NextApp and NextWidget remain UNVERIFIED. See RELEASE_GATED.md Gate A."

      - name: Install XcodeGen
        if: steps.probe.outputs.exists == 'true'
        run: brew install xcodegen

      - name: Generate the Xcode project
        if: steps.probe.outputs.exists == 'true'
        run: xcodegen generate

      # Evidence for a claim that would otherwise be an assumption. RELEASE_GATED.md B4a says
      # local StoreKit testing fails even with the configuration attached to the scheme — which
      # is only true if XcodeGen actually put it there rather than ignoring an unknown key.
      - name: Confirm the scheme carries the StoreKit configuration
        if: steps.probe.outputs.exists == 'true'
        run: |
          SCHEME="NextApp.xcodeproj/xcshareddata/xcschemes/NextApp.xcscheme"
          if grep -q "StoreKitConfiguration" "$SCHEME"; then
            grep -o 'StoreKitConfigurationFileReference[^>]*' "$SCHEME" | head -2
            echo "::notice title=StoreKit::The generated scheme references a StoreKit configuration."
          else
            echo "::warning title=StoreKit::The generated scheme has no StoreKit configuration reference. RELEASE_GATED.md B4a claims the scheme route was measured — if this warning appears, that claim covers only the SKTestSession route and must be corrected."
          fi

      # Runner images change their bundled simulators without warning, so pinning a device
      # name here would break the build for a reason that has nothing to do with the code.
      - name: Pick an available iPhone simulator
        if: steps.probe.outputs.exists == 'true'
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = [d["name"]
                   for runtime, entries in devices.items() if "iOS" in runtime
                   for d in entries if d.get("isAvailable") and "iPhone" in d["name"]]
          if not found:
              sys.exit("No available iPhone simulator on this runner")
          print(sorted(found)[-1])
          ')
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build and test on the iOS Simulator
        if: steps.probe.outputs.exists == 'true'
        run: |
          xcodebuild test \
            -project NextApp.xcodeproj \
            -scheme NextApp \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -resultBundlePath TestResults.xcresult \
            -skip-testing:NextAppUITests/ScreenshotCaptureUITests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # Everything above this point compiles Debug — `xcodebuild test` runs the scheme's Test
      # action, which project.yml pins to Debug. Release is a materially different compile:
      # whole-module optimisation instead of incremental, dead-code stripping, product
      # validation. Nothing in this repository had ever built it.
      #
      # `SWIFT_TREAT_WARNINGS_AS_ERRORS` is passed on the command line rather than set in
      # project.yml on purpose. In project.yml it would apply to every target in every
      # configuration and to local Xcode, so a newly deprecated SDK symbol or a new macro
      # diagnostic from a runner image update would turn main red for a reason nobody here
      # controls — the same trap the simulator-name step above already refuses. Scoped here it
      # gates exactly one build and is withdrawn by deleting one line.
      #
      # It does apply to the NextKit package targets that this build compiles, which is
      # deliberate: NextKit is ours and is measured clean.
      - name: Release build with warnings as errors (app + widget)
        if: steps.probe.outputs.exists == 'true'
        run: |
          set -o pipefail
          xcodebuild build \
            -project NextApp.xcodeproj \
            -scheme NextApp \
            -configuration Release \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      # The App Store set, captured from the app rather than reproduced (D-024). Run on a Pro Max
      # because that is the only simulator whose screen is the 1290 × 2796 the listing wants; if
      # the runner image has none, the step says so loudly and skips rather than quietly handing
      # back frames of the wrong size.
      - name: Pick a Pro Max simulator
        if: steps.probe.outputs.exists == 'true'
        id: bigsim
        run: |
          # The identifier first and the name second, one per line. Every Pro Max name contains
          # spaces, so anything that splits a single line on whitespace gets "iPhone" and "17".
          FOUND=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = [(d["name"], d["udid"])
                   for runtime, entries in devices.items() if "iOS" in runtime
                   for d in entries if d.get("isAvailable") and "Pro Max" in d["name"]]
          name, udid = sorted(found)[-1] if found else ("", "")
          print(udid)
          print(name)
          ')
          UDID=$(printf '%s\n' "$FOUND" | head -n 1)
          DEVICE=$(printf '%s\n' "$FOUND" | tail -n 1)
          if [ -z "$DEVICE" ]; then
            echo "::warning title=Screenshots::No Pro Max simulator on this runner, so the App Store set was not captured."
          else
            echo "Capturing on: $DEVICE ($UDID)"
          fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # Six frames in one listing must not disagree about the time. Without this the set came back
      # reading 4:53 on five of them and 4:54 on the sixth, which is the same class of thing as the
      # varying "chin" the owner spotted under each screen: nobody can say why it looks wrong, and
      # everybody can see that it does.
      #
      # Best effort on purpose. An override that fails is not a reason to lose the capture, so this
      # never fails the job — the frames are simply less tidy, and the drift is visible in them.
      - name: Pin the simulator's status bar
        if: steps.probe.outputs.exists == 'true' && steps.bigsim.outputs.udid != ''
        continue-on-error: true
        run: |
          xcrun simctl boot "${{ steps.bigsim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.bigsim.outputs.udid }}" -b || true
          xcrun simctl status_bar "${{ steps.bigsim.outputs.udid }}" override \
            --time "9:41" \
            --dataNetwork wifi \
            --wifiMode active \
            --wifiBars 3 \
            --cellularMode active \
            --cellularBars 4 \
            --batteryState charged \
            --batteryLevel 100

      # Addressed by identifier, not by name. The status bar is pinned on one specific simulator,
      # and a runner image can carry the same device name on two runtimes — so `name=` is free to
      # resolve to a different device than the one that was pinned, which is exactly what it did:
      # the step reported success and the frames came back with a live clock reading 9:01 and 9:02.
      - name: Capture the App Store screenshots
        if: steps.probe.outputs.exists == 'true' && steps.bigsim.outputs.udid != ''
        env:
          CAPTURE_SCREENSHOTS: "1"
        run: |
          xcodebuild test \
            -project NextApp.xcodeproj \
            -scheme NextApp \
            -destination "platform=iOS Simulator,id=${{ steps.bigsim.outputs.udid }}" \
            -only-testing:NextAppUITests/ScreenshotCaptureUITests \
            -resultBundlePath Screenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CAPTURE_SCREENSHOTS=1

      - name: Export the screenshots as files
        if: steps.probe.outputs.exists == 'true' && steps.bigsim.outputs.udid != ''
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments \
            --path Screenshots.xcresult \
            --output-path screenshots || \
            echo "::warning title=Screenshots::xcresulttool could not export attachments; the raw bundle is still uploaded."
          find screenshots -type f | head -40
          ls -la screenshots || true

          # A capture step that produces nothing must not report success. The first run of this
          # did exactly that: the test skipped itself and every step stayed green.
          COUNT=$(find screenshots -type f \( -name '*.png' -o -name '*.jpeg' -o -name '*.jpg' \) | wc -l | tr -d ' ')
          echo "Exported $COUNT image(s)."
          if [ "$COUNT" -lt 6 ]; then
            echo "::error title=Screenshots::Expected 6 frames, exported $COUNT. Check that the capture test actually ran rather than being skipped."
            exit 1
          fi

      - name: Upload the App Store screenshots
        if: always() && steps.probe.outputs.exists == 'true' && steps.bigsim.outputs.udid != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: |
            screenshots
            Screenshots.xcresult
          if-no-files-found: warn

      - name: Upload test results
        if: always() && steps.probe.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
