name: CI

# Verification tiers are defined in ARCHITECTURE.md §6 and DECISIONS.md D-001.
# Tier 1 proves the NextKit core. Tier 2 proves the iOS app layer compiles and its
# Simulator tests pass. Neither requires an Apple Developer Program membership —
# Simulator builds are unsigned. Only Tier 3 (real devices, TestFlight, submission)
# is gated, and that lives in RELEASE_GATED.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    name: Guardrails — NextKit purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce D-002 and D-007
        run: bash scripts/lint-nextkit.sh

      # A product identifier typo compiles, passes every test that uses the Swift constant, and
      # only shows up when a real purchase fails to resolve.
      - name: Enforce the NEXT+ product catalogue
        run: bash scripts/lint-storekit.sh

  tier1:
    name: Tier 1 — NextKit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        run: swift --version

      - name: Build
        run: swift build --package-path NextKit

      - name: Test
        run: swift test --package-path NextKit

  tier2:
    name: Tier 2 — iOS app (Simulator)
    runs-on: macos-latest
    needs: tier1
    steps:
      - uses: actions/checkout@v4

      - name: Does the app layer exist yet?
        id: probe
        run: |
          if [ -f project.yml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Deliberately loud rather than a silent green tick. A job that passes because there
      # was nothing to do must never be mistakable for a job that passed because the app
      # compiled. See TESTING.md — no claim may outrun its tier.
      - name: Nothing to verify yet
        if: steps.probe.outputs.exists == 'false'
        run: |
          echo "::notice title=Tier 2 skipped::project.yml does not exist yet, so the iOS app layer has not been created. NextApp and NextWidget remain UNVERIFIED. See RELEASE_GATED.md Gate A."

      - name: Install XcodeGen
        if: steps.probe.outputs.exists == 'true'
        run: brew install xcodegen

      - name: Generate the Xcode project
        if: steps.probe.outputs.exists == 'true'
        run: xcodegen generate

      # Evidence for a claim that would otherwise be an assumption. RELEASE_GATED.md B4a says
      # local StoreKit testing fails even with the configuration attached to the scheme — which
      # is only true if XcodeGen actually put it there rather than ignoring an unknown key.
      - name: Confirm the scheme carries the StoreKit configuration
        if: steps.probe.outputs.exists == 'true'
        run: |
          SCHEME="NextApp.xcodeproj/xcshareddata/xcschemes/NextApp.xcscheme"
          if grep -q "StoreKitConfiguration" "$SCHEME"; then
            grep -o 'StoreKitConfigurationFileReference[^>]*' "$SCHEME" | head -2
            echo "::notice title=StoreKit::The generated scheme references a StoreKit configuration."
          else
            echo "::warning title=StoreKit::The generated scheme has no StoreKit configuration reference. RELEASE_GATED.md B4a claims the scheme route was measured — if this warning appears, that claim covers only the SKTestSession route and must be corrected."
          fi

      # Runner images change their bundled simulators without warning, so pinning a device
      # name here would break the build for a reason that has nothing to do with the code.
      - name: Pick an available iPhone simulator
        if: steps.probe.outputs.exists == 'true'
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          found = [d["name"]
                   for runtime, entries in devices.items() if "iOS" in runtime
                   for d in entries if d.get("isAvailable") and "iPhone" in d["name"]]
          if not found:
              sys.exit("No available iPhone simulator on this runner")
          print(sorted(found)[-1])
          ')
          echo "Using simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Build and test on the iOS Simulator
        if: steps.probe.outputs.exists == 'true'
        run: |
          xcodebuild test \
            -project NextApp.xcodeproj \
            -scheme NextApp \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload test results
        if: always() && steps.probe.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
