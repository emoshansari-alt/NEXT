# XcodeGen spec for the NEXT iPhone app.
#
# The .xcodeproj is GENERATED from this file and is gitignored (DECISIONS.md D-003).
# A hand-authored project.pbxproj cannot be reviewed from the Windows development machine,
# is merge-hostile, and drifts silently from intent. This is reviewable and reproducible:
#
#     xcodegen generate && open NextApp.xcodeproj
#
# CI runs exactly that on a macOS runner before building.

name: NextApp

options:
  bundleIdPrefix: com.nextapp
  deploymentTarget:
    iOS: "17.0"          # DECISIONS.md D-004 — floor chosen for student-owned older hardware
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  NextKit:
    path: NextKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # No signing anywhere: the app is only ever built for the Simulator until an Apple
    # Developer Program membership exists (RELEASE_GATED.md Gate B).
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""

targets:

  NextApp:
    type: application
    platform: iOS
    sources:
      - path: NextApp/Sources
      # Compiled into both the app and the widget. Forty lines with no state — an embedded
      # framework would cost launch time in an extension expected to render in milliseconds.
      - path: NextApp/Shared
    dependencies:
      - package: NextKit
        product: NextKit
      - target: NextWidgetExtension
        embed: true
    entitlements:
      path: NextApp/NextApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nextapp.next
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextapp.next
        # PRODUCT_NAME is deliberately NOT overridden. Setting it to "NEXT" renames the
        # bundle to NEXT.app, but XcodeGen derives the test target's TEST_HOST from the
        # target name, so it goes looking for NextApp.app/NextApp and the build fails with
        # "Could not find test host". The user-facing name comes from CFBundleDisplayName
        # below, which is the right knob for it anyway.
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"        # iPhone only — iPhone-first is settled
        INFOPLIST_FILE: NextApp/Info.plist
        # No app icon or launch asset catalogue yet — that is Phase 12 (visual polish).
        # Referencing one before it exists would fail the build for no useful reason.
    info:
      path: NextApp/Info.plist
      properties:
        CFBundleDisplayName: NEXT
        UILaunchScreen: {}
        # Lets the widget and notification reminders open a specific task. Parsed by
        # NextKit's DeepLink so every entry point agrees on the format.
        CFBundleURLTypes:
          - CFBundleURLName: com.nextapp.next
            CFBundleURLSchemes: [next]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false

  # The widget reads a snapshot the app writes. It never opens the task store: widget
  # extensions run under a hard memory limit and are woken at unpredictable moments, so
  # standing up SwiftData to render two lines of text would be slow and fragile.
  NextWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: NextWidget/Sources
      - path: NextApp/Shared
    dependencies:
      - package: NextKit
        product: NextKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextapp.next.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NextWidget/Info.plist
        SKIP_INSTALL: YES
    info:
      path: NextWidget/Info.plist
      properties:
        CFBundleDisplayName: NEXT
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NextWidget/NextWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nextapp.next

  # No NextApp/Shared here: `@testable import NextApp` already exposes those types, and
  # compiling them into the test target as well would duplicate the symbols.
  NextAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NextApp/Tests
      # The StoreKit configuration is a resource of the *test bundle*, not of the app.
      #
      # SKTestSession loads it by name from the test bundle and needs no scheme setting and no
      # signing, which is why it was chosen over the scheme's StoreKit Configuration option —
      # that option is an Xcode scheme feature whose behaviour under `xcodebuild` was unknown,
      # and this route sidesteps the question entirely. It also keeps the file out of the app,
      # so nothing about a shipping build changes.
      - path: NextApp/NEXT.storekit
        buildPhase: resources
    dependencies:
      - target: NextApp
      # The storage contract, shared with Tier 1 rather than re-derived here. This is what
      # lets the SwiftData store be held to the identical promises as the in-memory one.
      - package: NextKit
        product: NextKitTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextapp.next.tests
        GENERATE_INFOPLIST_FILE: YES

  NextAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NextApp/UITests
    dependencies:
      - target: NextApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nextapp.next.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NextApp:
    build:
      targets:
        NextApp: all
        NextAppTests: [test]
        NextAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - NextAppTests
        - NextAppUITests
